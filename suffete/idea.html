<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUFFETE — Your Idea</title><style>
*{box-sizing:border-box}body{margin:0;background:#08111d;color:#f1f6fa;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}a{color:inherit;text-decoration:none}header{height:82px;border-bottom:1px solid #24364b;background:#0a1522;display:flex;align-items:center;padding:0 max(5%,calc((100% - 1320px)/2));gap:12px}header img{width:42px;height:42px;object-fit:contain}.brand strong{font-size:16px;letter-spacing:.12em}.brand small{display:block;color:#91a4b6;font-size:8px;letter-spacing:.14em;margin-top:4px}.topend{margin-inline-start:auto;display:flex;align-items:center;gap:20px}.topend a{color:#b3c3d1;font-size:13px}.topend select{background:#122234;color:#dce8f3;border:1px solid #334b61;padding:9px}.page{max-width:1190px;margin:auto;padding:76px 24px 90px;display:grid;grid-template-columns:.9fr 1.1fr;gap:70px;align-items:start}.eyebrow{color:#78bbff;font-size:11px;letter-spacing:.14em;font-weight:700}.intro h1{font-size:clamp(34px,4vw,53px);line-height:1.3;letter-spacing:-.035em;margin:22px 0}.intro p{color:#aebfce;line-height:1.95;font-size:16px}.assessment{border-inline-start:2px solid #4d9fea;padding-inline-start:18px;margin-top:35px;color:#d2e2ee;font-size:13px;line-height:1.8}.formbox{background:#101e2d;border:1px solid #2b4053;padding:32px}.formbox h2{font-size:21px;margin:0 0 8px}.formbox>p{color:#a3b5c5;font-size:13px;line-height:1.8;margin-bottom:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:flex;flex-direction:column;gap:7px;font-size:13px;color:#cedbe6}.field.full{grid-column:1/-1}input,textarea,select,button{font:inherit}input:not([type=file]),textarea{width:100%;background:#0a1521;color:#f0f6fb;border:1px solid #3a5063;padding:13px;outline:none;border-radius:0}textarea{resize:vertical;min-height:110px}input:focus,textarea:focus{border-color:#70baff}.hint{color:#8fa3b5;font-size:11px;line-height:1.7}.upload{border:1px dashed #46637b;padding:16px;background:#0c1926}.upload input{width:100%;font-size:12px;color:#b9cbda}.btn{border:1px solid #5daeff;background:#5daeff;color:#071521;padding:15px 22px;font-weight:700;cursor:pointer}.btn:hover{background:#82c1ff}.btn:disabled{opacity:.5;cursor:wait}.result{padding:14px;margin-top:16px;line-height:1.7;font-size:13px}.success{background:#183b34;color:#bee8d7;border:1px solid #376554}.error{background:#3c2224;color:#ffceca;border:1px solid #704142}.hidden{display:none}.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}[dir=rtl] .intro h1{letter-spacing:0}[dir=rtl] .eyebrow{letter-spacing:0}@media(max-width:800px){.page{grid-template-columns:1fr;gap:35px;padding-top:44px}.formbox{padding:24px}}@media(max-width:480px){header{padding:0 14px}.topend{gap:10px}.topend a{font-size:11px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.formbox{padding:20px}.page{padding-inline:16px}}
</style></head><body><header><a href="index.html"><img src="logo.png" alt=""></a><a class="brand" href="index.html"><strong>SUFFETE</strong><small>INTELLIGENT SYSTEMS</small></a><div class="topend"><a href="index.html" data-k="back"></a><select id="language" aria-label="Language"><option value="en">English</option><option value="tr">Türkçe</option><option value="ar">العربية</option></select></div></header><main class="page"><div class="intro"><div class="eyebrow" data-k="eyebrow"></div><h1 data-k="title"></h1><p data-k="description"></p><div class="assessment" data-k="assessment"></div></div><section class="formbox"><h2 data-k="formTitle"></h2><p data-k="formIntro"></p><form id="ideaForm"><div class="grid"><label class="field"><span data-k="name"></span><input name="name" maxlength="100" required autocomplete="name"></label><label class="field"><span data-k="company"></span><input name="company" maxlength="150" autocomplete="organization"></label><label class="field"><span data-k="email"></span><input name="email" type="email" maxlength="254" required autocomplete="email"></label><label class="field"><span data-k="phone"></span><input name="phone" type="tel" maxlength="50" autocomplete="tel"></label><label class="field full"><span data-k="industry"></span><input name="industry" maxlength="150" required></label><label class="field full"><span data-k="project"></span><input name="title" maxlength="200" required></label><label class="field full"><span data-k="details"></span><textarea name="description" maxlength="6000" required></textarea></label><label class="field full"><span data-k="outcome"></span><textarea name="outcome" maxlength="3000" required></textarea></label><label class="field full"><span data-k="files"></span><div class="upload"><input id="files" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/png,image/jpeg,image/webp" multiple><span class="hint" data-k="fileHint"></span></div></label><label class="trap" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><div class="field full"><span class="hint" data-k="privacy"></span><button class="btn" id="submit" type="submit" data-k="submit"></button></div></div><div id="result" role="status" aria-live="polite"></div></form></section></main><script>
const translations={ar:{back:'العودة للموقع',eyebrow:'لديك فكرة؟ — LET’S BUILD YOUR IDEA',title:'لديك فكرة أو احتياج خاص؟ دعنا نحولها إلى حل.',description:'ليس عليك الاختيار من الحلول الموجودة فقط. إذا كانت لديك فكرة جديدة، أو مشكلة تشغيلية تحتاج إلى حل تقني، أو نظام ترغب في تطويره خصيصاً لمنشأتك، شاركنا فكرتك وسنعمل على دراسة إمكانية تنفيذها وتطوير حل يناسب احتياجاتك.',assessment:'كل فكرة تخضع للدراسة والتقييم الفني قبل تأكيد إمكانية تنفيذها.',formTitle:'شاركنا فكرتك',formIntro:'أخبرنا عن فكرتك والنتيجة التي تتطلع إليها.',name:'الاسم *',company:'اسم الشركة أو المنشأة (اختياري)',email:'البريد الإلكتروني *',phone:'رقم الهاتف (اختياري)',industry:'مجال العمل *',project:'عنوان الفكرة أو المشروع *',details:'شرح الفكرة أو المشكلة التي تريد حلها *',outcome:'ما النتيجة التي تتوقعها من الحل؟ *',files:'صور أو ملفات توضيحية (اختياري)',fileHint:'حتى 3 ملفات PDF أو JPG أو PNG أو WEBP، بحد أقصى 2 ميغابايت لكل ملف.',privacy:'سيُحفظ طلبك ومرفقاته في مساحة إدارة خاصة لهذه النسخة التجريبية لمراجعته. لا ترسل بيانات سرية في المعاينة.',submit:'إرسال فكرتي ↗',sending:'جارٍ الإرسال…',success:'شكراً لمشاركة فكرتك معنا. سنراجع تفاصيل طلبك ونتواصل معك لمناقشة إمكانية تطويره وتنفيذه.',fail:'تعذر إرسال الطلب. تأكد من اتصالك وحاول مرة أخرى؛ لم تُرسل بياناتك.',invalidFiles:'اختر حتى 3 ملفات من الأنواع المدعومة، بحجم لا يزيد على 2 ميغابايت لكل ملف.'},en:{back:'Back to website',eyebrow:'HAVE AN IDEA? — LET’S BUILD YOUR IDEA',title:'Have an idea or a unique need? Let’s turn it into a solution.',description:'You are not limited to our existing solutions. If you have a new idea, an operational challenge that needs a technical solution, or a system you would like developed for your organization, share it with us. We will assess its feasibility and explore a solution suited to your needs.',assessment:'Every idea is subject to technical review and evaluation before feasibility can be confirmed.',formTitle:'Share your idea',formIntro:'Tell us about your idea and the outcome you are looking for.',name:'Full name *',company:'Company or organization (optional)',email:'Email address *',phone:'Phone number (optional)',industry:'Industry *',project:'Idea or project title *',details:'Describe the idea or problem you want to solve *',outcome:'What result do you expect from the solution? *',files:'Supporting images or files (optional)',fileHint:'Up to 3 PDF, JPG, PNG or WEBP files, maximum 2 MB each.',privacy:'Your request and attachments will be stored in the private admin area for this preview. Do not submit confidential information in the preview.',submit:'Send my idea ↗',sending:'Sending…',success:'Thank you for sharing your idea. We will review your request and contact you to discuss its potential development and implementation.',fail:'Your request could not be sent. Check your connection and try again; your information was not submitted.',invalidFiles:'Choose up to 3 supported files, each no larger than 2 MB.'},tr:{back:'Siteye dön',eyebrow:'BİR FİKRİNİZ Mİ VAR? — LET’S BUILD YOUR IDEA',title:'Bir fikriniz veya özel bir ihtiyacınız mı var? Birlikte çözüme dönüştürelim.',description:'Mevcut çözümlerimizle sınırlı değilsiniz. Yeni bir fikriniz, teknik çözüm gerektiren bir operasyonel sorununuz veya işletmenize özel geliştirmek istediğiniz bir sistem varsa bizimle paylaşın. Uygulanabilirliğini değerlendirerek ihtiyaçlarınıza uygun bir çözüm üzerinde çalışalım.',assessment:'Uygulanabilirlik doğrulanmadan önce her fikir teknik inceleme ve değerlendirmeye alınır.',formTitle:'Fikrinizi paylaşın',formIntro:'Fikrinizi ve beklediğiniz sonucu bize anlatın.',name:'Ad soyad *',company:'Şirket veya kuruluş (isteğe bağlı)',email:'E-posta *',phone:'Telefon (isteğe bağlı)',industry:'Faaliyet alanı *',project:'Fikir veya proje başlığı *',details:'Fikrinizi veya çözmek istediğiniz sorunu açıklayın *',outcome:'Çözümden beklediğiniz sonuç nedir? *',files:'Açıklayıcı görsel veya dosyalar (isteğe bağlı)',fileHint:'En fazla 3 PDF, JPG, PNG veya WEBP; dosya başına en fazla 2 MB.',privacy:'Talebiniz ve ekleriniz bu önizlemenin özel yönetim alanında saklanır. Önizlemede gizli bilgi göndermeyin.',submit:'Fikrimi gönder ↗',sending:'Gönderiliyor…',success:'Fikrinizi paylaştığınız için teşekkür ederiz. Talebinizi inceleyip geliştirme ve uygulama imkanını görüşmek üzere sizinle iletişime geçeceğiz.',fail:'Talebiniz gönderilemedi. Bağlantınızı kontrol edip yeniden deneyin; bilgileriniz gönderilmedi.',invalidFiles:'Desteklenen türde en fazla 3 dosya seçin; her dosya en fazla 2 MB olmalıdır.'}};
let lang=localStorage.getItem('suffete-lang')||'en';function setLanguage(){let t=translations[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('language').value=lang;document.querySelectorAll('[data-k]').forEach(x=>x.textContent=t[x.dataset.k]);}document.getElementById('language').onchange=e=>{lang=e.target.value;localStorage.setItem('suffete-lang',lang);setLanguage()};setLanguage();function readFile(f){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve({name:f.name,data:reader.result.split(',')[1]});reader.onerror=reject;reader.readAsDataURL(f)})}document.getElementById('ideaForm').addEventListener('submit',async e=>{e.preventDefault();let t=translations[lang],form=e.currentTarget,result=document.getElementById('result'),submit=document.getElementById('submit'),files=[...document.getElementById('files').files];result.className='';result.textContent='';if(files.length>3||files.some(f=>f.size>2000000||!(/\.(pdf|png|jpe?g|webp)$/i.test(f.name)))){result.className='result error';result.textContent=t.invalidFiles;return}submit.disabled=true;submit.textContent=t.sending;try{let body=Object.fromEntries(new FormData(form).entries());body.files=await Promise.all(files.map(readFile));let r=await fetch('/api/ideas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('request failed');result.className='result success';result.textContent=t.success;form.reset()}catch(err){result.className='result error';result.textContent=t.fail}finally{submit.disabled=false;submit.textContent=translations[lang].submit}});
</script></body></html>
