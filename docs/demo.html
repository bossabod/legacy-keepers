="stepTo(${step+1})" ${canNext()?'':'disabled'}>${t.next} &nbsp; →</button></div>`:`<h2>${t.review}</h2><p class="hint">${t.reviewText}</p><div class="review">${t.labels.map((x,i)=>`<div class="review-row"><div><small>${x}</small><strong>${valueFor(i)}</strong></div><button class="edit" onclick="stepTo(${i})">${t.edit} ↗</button></div>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="stepTo(5)">${t.previous}</button><button class="btn" onclick="startDemo()">${t.start} ↗</button></div>`}</div></main>`}function startDemo(){warehouses=[1,3,6,11][answers[3]];stock=Array.from({length:4},(_,i)=>Array.from({length:warehouses},(_,j)=>j===0?[500,120,80,24][i]:0));movements=[];view='app';page=0;save();render()}function save(){sessionStorage.setItem('suffete-demo-state',JSON.stringify({answers,stock,movements,warehouses,view,page}))}function wh(i){return `${t.wh} ${i+1}`}function names(i){const selected=answers[2]||[];let order=[];if(!selected.includes(5)){const map=[0,3,2,1,3];selected.forEach(x=>{let v=map[x];if(v!==undefined&&!order.includes(v))order.push(v)})}for(let x=0;x<4;x++)if(!order.includes(x))order.push(x);return t.dataset[answers[1]??6][order[i]]}function code(i){return ['10000001','10000002','10000003','10000004'][i]}function sum(i){return stock[i].reduce((a,b)=>a+b,0)}function fmt(n){return Number(n).toLocaleString(lang==='ar'?'ar':lang==='tr'?'tr':'en')}function date(v){return new Date(v).toLocaleString(lang==='ar'?'ar':lang==='tr'?'tr':'en',{dateStyle:'medium',timeStyle:'short'})}function typ(k){return k==='in'?t.in:k==='out'?t.out:t.transferType}function tableMoves(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>${t.date}</th><th>${t.name}</th><th>${t.type}</th><th>${t.quantity}</th><th>${t.warehouse}</th><th>${t.employee}</th><th>${t.department}</th></tr></thead><tbody>${list.map(m=>`<tr><td>${date(m.time)}</td><td>${names(m.i)}</td><td>${typ(m.type)}</td><td>${fmt(m.q)}</td><td>${wh(m.from)}${m.type==='transfer'?' → '+wh(m.to):''}</td><td>${esc(m.employee)}</td><td>${esc(m.department||'—')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${t.none}</div>`}function materialTable(filter='',w='all'){let list=[0,1,2,3].filter(i=>(names(i).toLocaleLowerCase().includes(filter.toLocaleLowerCase())||code(i).includes(filter))&&(w==='all'||stock[i][Number(w)]>0));return list.length?`<div class="table-wrap"><table><thead><tr><th>${t.name}</th><th>${t.barcode}</th><th>${t.stock}</th><th>${t.status}</th><th></th></tr></thead><tbody>${list.map(i=>{let n=w==='all'?sum(i):stock[i][Number(w)];return `<tr><td><button class="link" onclick="materialDetail(${i})">${names(i)}</button></td><td>${code(i)}</td><td>${fmt(n)} ${t.unitCount}</td><td><span class="tag ${n<30?'low':''}">${n<30?t.lowStatus:t.healthy}</span></td><td><button class="link" onclick="materialDetail(${i})">${t.open} ↗</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">${t.noResults}</div>`}function whOptions(){return Array.from({length:warehouses},(_,i)=>`<option value="${i}">${wh(i)}</option>`).join('')}function appShell(content){root.innerHTML=`<div class="app"><aside class="sidebar"><div class="side-label">SUFFETE / DEMO</div>${t.nav.map((n,i)=>`<button class="side-button ${page===i?'active':''}" onclick="go(${i})"><span>${['▦','▤','↙','↗','▣','⇄','◫'][i]}</span>${n}</button>`).join('')}</aside><main class="appmain"><div class="apphead"><div><div class="badge">SUFFETE / ${t.badge}</div><h1>${t.nav[page]}</h1><p>${page===0?t.welcome:t.example}</p></div><div class="head-actions"><button class="btn secondary" onclick="resetDemo()">${t.reset}</button><button class="btn" onclick="requestFull()">${t.request} ↗</button></div></div><div class="demo-notice">◈ &nbsp; ${t.notice}</div>${content}</main></div>`}function go(i){page=i;flash='';save();render()}function renderApp(){let content='';if(page===0){let total=stock.reduce((a,_,i)=>a+sum(i),0),low=stock.filter((_,i)=>sum(i)<30).length;content=`<div class="metrics">${[[t.totalMaterials,4],[t.totalStock,fmt(total)],[t.low,low],[t.moves,movements.length]].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong><em>${t.example}</em></div>`).join('')}</div><div class="panel"><h2>${t.review}</h2><div class="details-grid">${t.labels.map((label,i)=>`<div><small>${label}</small><b>${valueFor(i)}</b></div>`).join('')}</div></div><div class="panel"><h2>${t.recent}</h2>${tableMoves(movements.slice(0,6))}</div><div class="panel"><h2>${t.totalMaterials}</h2>${materialTable()}</div>`}else if(page===1){content=`<div class="panel"><div class="toolbar"><input class="input" id="search" placeholder="${t.search}" oninput="filterMaterials()"><select class="input" id="whFilter" onchange="filterMaterials()"><option value="all">${t.all}</option>${whOptions()}</select></div><div id="materialsTable">${materialTable()}</div></div>`}else if(page===2||page===3){content=transactionForm(page===2?'in':'out')}else if(page===4){content=`<div class="toolbar"><button class="btn" onclick="transferForm()">${t.transfer} ↗</button></div><div class="cards">${Array.from({length:warehouses},(_,w)=>`<div class="warehouse"><h3>▣ &nbsp; ${wh(w)}</h3>${[0,1,2,3].map(i=>`<p>${names(i)}: <b>${fmt(stock[i][w])} ${t.unitCount}</b></p>`).join('')}</div>`).join('')}</div>`}else if(page===5){content=`<div class="panel"><div class="toolbar"><select class="input" id="moveFilter" onchange="filterMoves()"><option value="all">${t.allTypes}</option><option value="in">${t.in}</option><option value="out">${t.out}</option><option value="transfer">${t.transferType}</option></select><select class="input" id="moveWh" onchange="filterMoves()"><option value="all">${t.all}</option>${whOptions()}</select></div><div id="movementTable">${tableMoves(movements)}</div></div>`}else{let deps={};movements.filter(x=>x.type==='out').forEach(x=>deps[x.department]=(deps[x.department]||0)+x.q);content=`<div class="panel"><h2>${t.nav[6]}</h2><p class="hint">${t.reportsIntro}</p><div class="metrics">${[[t.totalIn,movements.filter(x=>x.type==='in').reduce((a,x)=>a+x.q,0)],[t.totalOut,movements.filter(x=>x.type==='out').reduce((a,x)=>a+x.q,0)],[t.transfer,movements.filter(x=>x.type==='transfer').length],[t.low,stock.filter((_,i)=>sum(i)<30).length]].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${fmt(x[1])}</strong></div>`).join('')}</div></div><div class="panel"><h2>${t.materialReport}</h2>${[0,1,2,3].map(i=>`<div class="reportline"><span>${names(i)}</span><b>${fmt(sum(i))} ${t.unitCount}</b></div>`).join('')}</div><div class="panel"><h2>${t.deptReport}</h2>${Object.keys(deps).length?Object.entries(deps).map(([k,v])=>`<div class="reportline"><span>${esc(k)}</span><b>${fmt(v)} ${t.unitCount}</b></div>`).join(''):`<p class="hint">${t.none}</p>`}</div><div class="panel"><h2>${t.warehouseReport}</h2>${Array.from({length:warehouses},(_,w)=>`<div class="reportline"><span>${wh(w)}</span><b>${fmt(stock.reduce((a,row)=>a+row[w],0))} ${t.unitCount}</b></div>`).join('')}</div>`}appShell(content)}
function filterMaterials(){document.getElementById('materialsTable').innerHTML=materialTable(document.getElementById('search').value.trim(),document.getElementById('whFilter').value)}function filterMoves(){let type=document.getElementById('moveFilter').value,w=document.getElementById('moveWh').value;document.getElementById('movementTable').innerHTML=tableMoves(movements.filter(m=>(type==='all'||m.type===type)&&(w==='all'||m.from===Number(w)||(m.type==='transfer'&&m.to===Number(w)))))}function transactionForm(kind){return `<div class="panel"><h2>${kind==='in'?t.in:kind==='out'?t.out:t.transfer}</h2><p class="hint">${t.barcodeHint}</p><form id="transaction" class="form"><label class="field">${t.name}<select class="input" id="item" required>${[0,1,2,3].map(i=>`<option value="${i}">${names(i)} — ${code(i)}</option>`).join('')}</select></label><label class="field">${t.phone}<input class="input" id="scan" placeholder="10000001" inputmode="numeric"><small>${t.barcodeHint}</small></label><label class="field">${kind==='transfer'?t.from:t.warehouse}<select class="input" id="source">${whOptions()}</select></label>${kind==='transfer'?`<label class="field">${t.to}<select class="input" id="destination">${whOptions()}</select></label>`:''}<label class="field">${t.quantity}<input class="input" type="number" id="qty" min="1" max="1000000" step="1" required></label><label class="field">${t.employee}<input class="input" id="employee" required maxlength="80" placeholder="${t.staff}"></label>${kind==='out'?`<label class="field">${t.department}<input class="input" id="department" required maxlength="80" placeholder="${t.production}"></label>`:''}<div class="field full"><button class="btn" type="submit">${t.record} ↗</button><p id="formMessage" class="${flashError?'error':'success'}" role="status">${esc(flash)}</p></div></form></div>`}function attachTransaction(kind){const form=document.getElementById('transaction');if(!form)return;const scanner=document.getElementById('scan');scanner.oninput=()=>{let idx=[0,1,2,3].find(i=>code(i)===scanner.value.trim());if(idx!==undefined)document.getElementById('item').value=idx};form.onsubmit=e=>{e.preventDefault();let i=+document.getElementById('item').value,from=+document.getElementById('source').value,to=kind==='transfer'?+document.getElementById('destination').value:null,q=+document.getElementById('qty').value,employee=document.getElementById('employee').value.trim(),department=kind==='out'?document.getElementById('department').value.trim():'';let error='';if(scanner.value.trim()&&scanner.value.trim()!==code(i))error=t.barcodeHint;else if(!employee||(kind==='out'&&!department))error=t.invalid;else if(!Number.isInteger(q)||q<=0||q>1000000||(kind!=='in'&&q>stock[i][from]))error=t.invalid;else if(kind==='transfer'&&from===to)error=t.same;if(error){document.getElementById('formMessage').textContent=error;document.getElementById('formMessage').className='error';return}stock[i][from]+=kind==='in'?q:-q;if(kind==='transfer')stock[i][to]+=q;movements.unshift({i,from,to,q,employee,department,type:kind,time:Date.now()});flash=t.success;flashError=false;save();render()}}function transferForm(){page=4;appShell(transactionForm('transfer'));attachTransaction('transfer')}function materialDetail(i){let related=movements.filter(m=>m.i===i),inTotal=related.filter(m=>m.type==='in').reduce((a,m)=>a+m.q,0),outTotal=related.filter(m=>m.type==='out').reduce((a,m)=>a+m.q,0);let div=document.createElement('div');div.className='modal';div.innerHTML=`<div class="modal-inner" role="dialog" aria-modal="true"><div class="modal-title"><h2>${names(i)}</h2><button class="close" aria-label="${t.close}">×</button></div><p class="hint">${t.photo} · ${t.barcode}: ${code(i)}</p><div class="details-grid">${[[t.stock,fmt(sum(i))],[t.totalIn,fmt(inTotal)],[t.totalOut,fmt(outTotal)],[t.consumption,fmt(outTotal)],[t.unit,t.unitCount],[t.barcode,code(i)]].map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><h3>${t.warehouse}</h3>${Array.from({length:warehouses},(_,w)=>`<div class="reportline"><span>${wh(w)}</span><b>${fmt(stock[i][w])}</b></div>`).join('')}<h3>${t.history}</h3>${tableMoves(related)}</div>`;document.body.appendChild(div);div.querySelector('.close').onclick=()=>div.remove();div.onclick=e=>{if(e.target===div)div.remove()}}function resetDemo(){if(!confirm(t.confirmReset))return;startDemo();flash=t.demoReset}function requestFull(){const summary=t.labels.map((label,i)=>`${label}: ${valueFor(i)}`).join('\n');sessionStorage.setItem('suffete-quote-summary',summary);location.href='index.html?quote=demo#contact'}function render(){setupLang();if(view==='wizard')renderWizard();else{renderApp();if(page===2)attachTransaction('in');if(page===3)attachTransaction('out')}}setupLang();try{let saved=JSON.parse(sessionStorage.getItem('suffete-demo-state'));if(saved&&saved.view==='app'&&Array.isArray(saved.stock)){({answers,stock,movements,warehouses,view,page}=saved)}}catch(e){}render();
