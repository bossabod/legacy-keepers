/* Four system stages: scoped to the services section only. */
#services .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:stretch}
#services .card{height:100%;min-height:312px;padding:28px;display:flex;flex-direction:column;align-items:stretch;background:#0e1927;border:1px solid #26384a;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
#services .card:hover{transform:translateY(-5px);border-color:#65abed;box-shadow:0 12px 28px #0004}
#services .card .icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid #416382;background:#12263a;color:#94caff;font-size:12px;font-weight:700;letter-spacing:.04em}
#services .card h3{margin:24px 0 12px;color:#f5f8fb;font-size:18px;line-height:1.5}
#services .card p{margin:0 0 25px;color:#c5d2de;font-size:14px;line-height:1.85}
#services .stage-detail-button{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding:12px 14px;border:1px solid #3c668b;background:#142b41;color:#a8d4ff;font-size:13px;font-weight:700;text-align:start;transition:background .2s,border-color .2s}
#services .stage-detail-button:hover,#services .stage-detail-button:focus-visible{background:#1c3d5b;border-color:#82c3ff;outline:2px solid transparent}
[lang="ar"] #services .card h3{line-height:1.65;font-size:19px}
[lang="ar"] #services .card p{font-size:16px;line-height:1.95}
[lang="ar"] #services .stage-detail-button{font-size:15px}
@media(max-width:1050px){#services .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){#services .cards{grid-template-columns:1fr;gap:12px}#services .card{min-height:230px;padding:24px}}
#services .stage-top{display:flex;align-items:center;justify-content:space-between;gap:16px}#services .stage-symbol{width:38px;height:38px;display:grid;place-items:center;color:#77baff;opacity:.88}#services .stage-symbol svg{width:27px;height:27px}#services .stage-number{color:#86bdf0;font-size:12px;font-weight:700;letter-spacing:.08em}#services .card .icon.stage-symbol{opacity:1;width:42px;height:42px}#services .stage-symbol svg{width:23px;height:23px}

Object.assign(data.ar,{servicesTitle:'إدارة المخزون وتتبع المواد.',servicesIntro:'نظام مترابط لملفات المواد وعمليات المستودع عبر الهاتف ومتابعة الإدارة.',services:[['ملفات المواد والبحث','ملف متكامل لكل مادة، مع إمكانية البحث بالاسم أو الباركود.'],['عمليات المستودع عبر الهاتف','امسح باركود المادة من الهاتف لتسجيل الكميات الداخلة والخارجة.'],['المستودعات والأقسام والتحويلات','تتبع المواد وحركات نقلها بين المستودعات والأقسام المتعددة.'],['لوحة الإدارة والتقارير','تابع المخزون والمواد منخفضة الرصيد والحركات واستهلاك الأقسام وتقارير الجرد.']],serviceDetails:['يحتوي ملف كل مادة على اسمها وصورتها وباركودها ووصفها ووحدة قياسها والكمية الحالية. ابحث بالاسم أو الباركود وافتح سجل حركتها بالكامل.','يمسح الموظف باركود المادة بهاتفه ويسجل الكمية الداخلة أو الخارجة. تُضاف الكمية تلقائياً إلى الرصيد عند الدخول وتُخصم تلقائياً عند الخروج.','يدعم النظام تعدد المستودعات والأقسام وتسجيل التحويلات بينها، مع توثيق تاريخ العملية ووقتها والموظف والقسم المستلم.','تعرض لوحة الإدارة المخزون الحالي والمواد التي قاربت على النفاد وعمليات الدخول والخروج واستهلاك الأقسام وتقارير الجرد.'],featureTitle:'نظام واحد. رؤية كاملة لكل مادة.',featureText:'سجّل المواد وامسح الباركود من الهاتف، وتابع كل حركة بين المستودعات والأقسام.',features:['ملفات المواد بالصورة والباركود ووحدة القياس والرصيد','تسجيل الدخول والخروج من الهاتف وتحديث الرصيد تلقائياً','مستودعات وأقسام متعددة وسجل كامل للتحويلات والحركات','لوحة إدارة وتنبيهات انخفاض المخزون وتقارير الجرد'],phoneTitle:'المستودع على الهاتف',phoneScan:'مسح باركود المادة',phoneHint:'امسح لتسجيل حركة المادة',phoneStock:'الرصيد الحالي',phoneIn:'إدخال',phoneOut:'إخراج',exampleTitle:'مثال على طريقة العمل',example:'يبدأ المستودع برصيد 500 كغ. يمسح الموظف الباركود ويسجل دخول 200 كغ، فيصبح الرصيد 700 كغ. ثم يسحب قسم الإنتاج 150 كغ، فيصبح الرصيد 550 كغ. تُسجل كل عملية باسم الموظف وتاريخها ووقتها والقسم المستلم.',inventoryDetails:['ملف المادة: الاسم والصورة والباركود والوصف ووحدة القياس والكمية الحالية.','البحث بالاسم أو الباركود وفتح سجل المادة الكامل منذ تسجيلها.','عرض Object.assign(data.ar,{services:[['تسجيل المواد وإنشاء الباركود','ابدأ بتسجيل كل مادة داخل النظام وإنشاء ملف خاص بها يحتوي على اسمها وكودها وصورتها ووصفها ووحدة قياسها وكميتها. أنشئ باركوداً فريداً لكل مادة ليصبح وسيلة التعرف عليها وتتبعها في جميع مراحل حركتها داخل المصنع.'],['استلام المواد وإدخال المخزون','عند وصول المواد إلى المستودع، يمسح الموظف باركود كل مادة باستخدام الهاتف، ويسجل الكمية المستلمة ووحدة قياسها. تُضاف الكمية تلقائياً إلى رصيد المادة، مع توثيق تاريخ الاستلام واسم الموظف والمستودع.'],['تتبع حركة المواد بين الأقسام وحتى خروجها','تتبّع رحلة كل مادة منذ دخولها المستودع وحتى خروجها النهائي من المصنع. عند نقل المادة من قسم إلى آخر، يتم مسح باركودها وتسجيل القسم المرسل والقسم المستلم والكمية واسم الموظف المسؤول. سجّل جميع عمليات الصرف والاستهلاك والخروج، مع تحديث الرصيد تلقائياً في كل مرحلة.'],['الإدارة والجرد والتقارير','امنح الإدارة رؤية كاملة لحركة جميع المواد داخل المنشأة. تابع الكميات الموجودة والمتبقية، وإجمالي الدخول والخروج، واستهلاك كل قسم، ومواقع المواد، وسجل جميع الموظفين والعمليات. وفّر تقارير تفصيلية تساعد على الجرد ومراقبة المخزون ومعرفة تاريخ حركة أي مادة من البداية حتى النهاية.']],serviceDetails:['إنشاء ملف متكامل لكل مادة يشمل الاسم والكود والصورة والوصف ووحدة القياس والكمية، مع باركود فريد للبحث والتتبع.','مسح الباركود بالهاتف وتسجيل الكمية ووحدة القياس والموظف والمستودع وتاريخ الاستلام، مع تحديث رصيد المادة تلقائياً.','تسجيل القسم المرسل والمستلم والكمية والموظف المسؤول، وتتبع عمليات النقل والصرف والاستهلاك والخروج مع تحديث الرصيد في كل مرحلة.','متابعة الكميات والمواقع وإجمالي الدخول والخروج واستهلاك الأقسام وسجلات الموظفين والعمليات، مع تقارير الجرد وتاريخ كل مادة.']});
