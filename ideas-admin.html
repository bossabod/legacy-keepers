<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUFFETE — Idea Requests</title><style>*{box-sizing:border-box}body{margin:0;background:#08111d;color:#eaf3f9;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}main{max-width:1050px;margin:auto;padding:40px 20px}.panel{background:#111f2e;border:1px solid #30475c;padding:24px;margin:16px 0}h1{font-size:26px}h2{font-size:19px}p{line-height:1.8;color:#bdcbd7;white-space:pre-wrap}input,button{font:inherit}input{background:#091521;border:1px solid #40586c;color:white;padding:12px;width:min(420px,100%)}button{border:1px solid #55aaff;background:#55aaff;color:#081521;padding:11px 16px;cursor:pointer;font-weight:700}.secondary{background:transparent;color:#cde2f1;border-color:#435d72}.field{margin:10px 0}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.meta div{background:#162a3a;padding:12px;overflow-wrap:anywhere}.meta small{display:block;color:#8ca2b3;margin-bottom:5px}.buttons{display:flex;gap:10px;flex-wrap:wrap}.buttons button{margin-top:8px}.error{color:#ffc1b9}.muted{color:#8da3b4;font-size:12px}.files button{margin:4px;background:transparent;color:#a6d5ff;border-color:#48677e}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top a{color:#afcee4}</style></head><body><main><div class="top"><h1>طلبات الأفكار — SUFFETE</h1><a href="idea.html">صفحة إرسال الفكرة</a></div><p class="muted">منطقة مراجعة خاصة للنسخة التجريبية. لا تحفظ كلمة المرور في المتصفح.</p><div id="login" class="panel"><form id="form"><label>مفتاح الإدارة<br><input id="key" type="password" autocomplete="current-password" required></label><p><button type="submit">دخول</button></p><div id="error" class="error" role="alert"></div></form></div><div id="app" hidden><div class="buttons"><button id="refresh">تحديث الطلبات</button><button class="secondary" id="logout">تسجيل الخروج</button></div><div id="list"></div></div></main><script>
let key='';const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let r=await fetch('/api/ideas',{headers:{'X-Admin-Key':key},cache:'no-store'});if(!r.ok)throw Error('unauthorized');let data=await r.json();document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;document.getElementById('list').innerHTML=data.ideas.length?data.ideas.map(x=>`<article class="panel"><div class="top"><h2>${safe(x.title)}</h2><span class="muted">#${x.id} · ${safe(x.created_at)} UTC</span></div><div class="meta"><div><small>الاسم</small>${safe(x.name)}</div><div><small>الشركة</small>${safe(x.company||'—')}</div><div><small>البريد الإلكتروني</small>${safe(x.email)}</div><div><small>الهاتف</small>${safe(x.phone||'—')}</div><div><small>مجال العمل</small>${safe(x.industry)}</div></div><h3>الفكرة أو المشكلة</h3><p>${safe(x.description)}</p><h3>النتيجة المتوقعة</h3><p>${safe(x.outcome)}</p><h3>المرفقات</h3><div class="files">${data.files.filter(f=>f.idea_id===x.id).map(f=>`<button data-file="${f.id}">${safe(f.filename)} ↓</button>`).join('')||'<span class="muted">لا توجد مرفقات</span>'}</div></article>`).join(''):'<div class="panel">لا توجد طلبات بعد.</div>';document.querySelectorAll('[data-file]').forEach(b=>b.onclick=async()=>{let r=await fetch('/api/ideas/files/'+b.dataset.file,{headers:{'X-Admin-Key':key},cache:'no-store'});if(!r.ok){alert('تعذر تنزيل المرفق');return}let blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=b.textContent.replace(/ ↓$/,'');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)})}document.getElementById('form').onsubmit=async e=>{e.preventDefault();key=document.getElementById('key').value;try{await load();document.getElementById('key').value='';document.getElementById('error').textContent=''}catch(e){key='';document.getElementById('error').textContent='تعذر الدخول. تحقق من المفتاح وحاول مجدداً.'}};document.getElementById('refresh').onclick=()=>load().catch(()=>alert('تعذر تحديث الطلبات'));document.getElementById('logout').onclick=()=>{key='';document.getElementById('app').hidden=true;document.getElementById('login').hidden=false;document.getElementById('list').textContent=''};
</script></body></html>
